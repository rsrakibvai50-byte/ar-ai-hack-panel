<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR AI HACK PANEL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #0b0f19;
            font-family: sans-serif;
        }
        #gameFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }
        #app-widget {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 290px;
            background: linear-gradient(145deg, rgba(10,10,10,0.95), rgba(26,26,46,0.95));
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            padding: 15px;
            color: #fff;
            touch-action: none;
        }
        .title {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 8px;
            cursor: move;
            padding: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 6px;
        }
        .input-box {
            width: 100%;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid #00ffcc;
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
            text-align: center;
            outline: none;
            margin-bottom: 8px;
            user-select: text;
        }
        .btn {
            width: 100%;
            padding: 8px;
            background: #00ffcc;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .telegram-btn {
            background: #0088cc;
            color: #fff;
            margin-bottom: 8px;
        }
        .period-display {
            font-size: 12px;
            color: #ffcc00;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .prediction {
            font-size: 24px;
            font-weight: 900;
            color: #00ffcc;
            margin: 4px 0;
        }
        .lucky-num {
            font-size: 13px;
            color: #ffcc00;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .timer-box {
            font-size: 12px;
            color: #00ffcc;
            font-weight: bold;
            margin-bottom: 6px;
            background: rgba(0,255,204,0.1);
            padding: 3px;
            border-radius: 4px;
        }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .win-text { color: #00ffcc; font-weight: bold; }
        .loss-text { color: #ff3355; font-weight: bold; }
        
        .notification-box {
            font-size: 11px;
            padding: 5px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: bold;
            background: rgba(255,255,255,0.05);
            color: #00ffcc;
        }

        .footer-btns {
            display: flex;
            gap: 8px;
        }
        .footer-btns button {
            flex: 1;
            padding: 6px;
            font-size: 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .exit-btn { background: #ff3355; color: #fff; }
        .hide-btn { background: #00ffcc; color: #000; }

        #show-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            z-index: 10000;
            display: none;
            box-shadow: 0 0 15px rgba(0,255,204,0.5);
        }
    </style>
</head>
<body>

    <!-- গেম লোড করার জন্য iframe (কিছু ওয়েবসাইট iframe সাপোর্ট না করলে এক্সটার্নাল ব্রাউজারে করতে হয়) -->
    <iframe id="gameFrame" src="https://dkwin15.com/#/login"></iframe>

    <div id="app-widget">
        <div class="title" id="panelHeader">AR AI HACK PANEL (Drag Here)</div>

        <!-- সেটআপ স্ক্রিন (প্রথমবার পিরিয়ড নম্বর বসানোর জন্য) -->
        <div id="setup-screen">
            <input type="text" id="startPeriodInput" class="input-box" placeholder="ENTER START PERIOD (e.g. 20260929...)">
            <button class="btn" onclick="startPanel()">START PANEL</button>
            <button class="btn telegram-btn" onclick="openTelegram()">TELEGRAM</button>
        </div>

        <!-- মেইন গেম ও সিগন্যাল ড্যাশবোর্ড -->
        <div id="mainDashboard" style="display: none;">
            <div class="period-display" id="periodDisplayBox">PERIOD: --</div>
            <div class="timer-box" id="timerDisplay">TIME LEFT: 30s</div>
            
            <div class="prediction" id="predictionBox">--</div>
            <div class="lucky-num" id="luckyNumberBox">LUCKY: --</div>
            
            <div class="stats-box">
                <span>WIN: <span id="winCount" class="win-text">0</span></span>
                <span>LOSS: <span id="lossCount" class="loss-text">0</span></span>
            </div>

            <div id="notificationBox" class="notification-box">Status: Live Synced ⚡</div>

            <div class="footer-btns">
                <button class="exit-btn" onclick="location.reload()">RESET</button>
                <button class="hide-btn" onclick="hideWidget()">HIDE</button>
            </div>
        </div>
    </div>

    <button id="show-btn" onclick="showWidget()">SHOW</button>

    <script>
        let wins = 0;
        let currentPeriodNumber = null;
        let countdownTimer = null;
        let mainInterval = null;

        function openTelegram() {
            window.open('https://t.me/+8801947320321', '_blank');
        }

        function startPanel() {
            let inputVal = document.getElementById('startPeriodInput').value.trim();
            if(!inputVal || isNaN(inputVal)) {
                alert("দয়া করে সঠিক পিরিয়ড নম্বর লিখুন!");
                return;
            }

            currentPeriodNumber = BigInt(inputVal);

            // পাসওয়ার্ড বা সেটআপ স্ক্রিন লুকিয়ে মেইন প্যানেল ওপেন করা
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'block';

            // প্রথম সিগন্যাল জেনারেট করা
            updateSignalAndPeriod();

            // প্রতি ৩০ সেকেন্ড পর পর পিরিয়ড ও সিগন্যাল আপডেট করার লুপ
            if(mainInterval) clearInterval(mainInterval);
            mainInterval = setInterval(() => {
                currentPeriodNumber += 1n;
                updateSignalAndPeriod();
            }, 30000);

            // ৩০ সেকেন্ডের লাইভ রানিং কাউন্টডাউন টাইমার শুরু
            startLiveTimer();
        }

        function updateSignalAndPeriod() {
            // পিরিয়ড ডিসপ্লে আপডেট
            document.getElementById('periodDisplayBox').innerText = "PERIOD: " + currentPeriodNumber.toString();

            // রেন্ডম বিগ বা স্মল সিগন্যাল
            const types = ['BIG 🔴', 'SMALL 🟢'];
            const pred = types[Math.floor(Math.random() * types.length)];
            document.getElementById('predictionBox').innerText = pred;

            // লাকি নম্বর জেনারেশন
            let lucky;
            if (pred.includes("BIG")) {
                lucky = Math.floor(Math.random() * 5) + 5;
            } else {
                lucky = Math.floor(Math.random() * 5);
            }
            document.getElementById('luckyNumberBox').innerText = "LUCKY: " + lucky;

            // উইন কাউন্ট আপডেট
            wins++;
            document.getElementById('winCount').innerText = wins;
        }

        function startLiveTimer() {
            if(countdownTimer) clearInterval(countdownTimer);
            
            let getSecondsLeft = () => {
                let d = new Date();
                let sec = d.getSeconds();
                // ৩০ সেকেন্ডের সাইকেল অনুযায়ী বাকি সেকেন্ড হিসাব করা
                return sec < 30 ? (29 - sec) : (59 - sec);
            };

            let timeLeft = getSecondsLeft();

            countdownTimer = setInterval(() => {
                timeLeft = getSecondsLeft();
                document.getElementById('timerDisplay').innerText = "TIME LEFT: " + (timeLeft < 10 ? "0" + timeLeft : timeLeft) + "s";
            }, 1000);
        }

        function hideWidget() {
            document.getElementById('app-widget').style.display = 'none';
            document.getElementById('show-btn').style.display = 'block';
        }

        function showWidget() {
            document.getElementById('app-widget').style.display = 'flex';
            document.getElementById('show-btn').style.display = 'none';
        }

        // প্যানেল ড্র্যাগ করার অপশন
        function makeDraggable(elmnt, handle) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            let dragItem = handle || elmnt;

            dragItem.onmousedown = dragMouseDown;
            dragItem.addEventListener('touchstart', dragTouchStart, { passive: false });

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.transform = "none";
            }

            function dragTouchStart(e) {
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                document.addEventListener('touchend', closeDragElement, { passive: false });
                document.addEventListener('touchmove', elementTouchDrag, { passive: false });
            }

            function elementTouchDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.touches[0].clientX;
                pos2 = pos4 - e.touches[0].clientY;
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.transform = "none";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.removeEventListener('touchend', closeDragElement);
                document.removeEventListener('touchmove', elementTouchDrag);
            }
        }

        makeDraggable(document.getElementById("app-widget"), document.getElementById("panelHeader"));
        makeDraggable(document.getElementById("show-btn"));
    </script>
</body>
</html>
