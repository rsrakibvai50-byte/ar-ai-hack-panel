<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR AI HACK PANEL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #0b0f19;
            font-family: sans-serif;
        }
        /* Background Game Iframe */
        #gameFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }
        /* Floating AI Hack Panel Widget */
        #app-widget {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            background: linear-gradient(145deg, rgba(10,10,10,0.95), rgba(26,26,46,0.95));
            border-radius: 20px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            padding: 15px;
            color: #fff;
            touch-action: none;
        }
        .title {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 10px;
            cursor: move;
            padding: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 6px;
        }
        .input-box {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid #00ffcc;
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
            text-align: center;
            outline: none;
            margin-bottom: 10px;
            user-select: text;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #00ffcc;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .telegram-btn {
            background: #0088cc;
            color: #fff;
        }
        #mainDashboard {
            display: none;
            text-align: center;
        }
        .prediction {
            font-size: 24px;
            font-weight: 900;
            color: #00ffcc;
            margin: 4px 0;
        }
        .lucky-num {
            font-size: 13px;
            color: #ffcc00;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .timer {
            font-size: 13px;
            color: #ffcc00;
            margin-top: 2px;
            margin-bottom: 8px;
        }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            padding: 6px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .win-text { color: #00ffcc; font-weight: bold; }
        .loss-text { color: #ff3355; font-weight: bold; }
        
        .notification-box {
            font-size: 11px;
            padding: 5px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: bold;
            background: rgba(255,255,255,0.05);
        }

        .footer-btns {
            display: flex;
            gap: 8px;
        }
        .footer-btns button {
            flex: 1;
            padding: 6px;
            font-size: 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .exit-btn { background: #ff3355; color: #fff; }
        .hide-btn { background: #00ffcc; color: #000; }

        #show-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            z-index: 10000;
            display: none;
            box-shadow: 0 0 15px rgba(0,255,204,0.5);
        }
    </style>
</head>
<body>

    <!-- Background Auto Game Site Iframe -->
    <iframe id="gameFrame" src="https://dkwin15.com/#/login"></iframe>

    <!-- Floating AI Hack Panel Widget -->
    <div id="app-widget">
        <div class="title" id="panelHeader">AR AI HACK PANEL (Drag Here)</div>

        <!-- Login Screen with Password -->
        <div id="login-screen">
            <input type="password" id="passInput" class="input-box" placeholder="ENTER PASSWORD">
            <button class="btn" onclick="checkLogin()">LOGIN NOW</button>
            <button class="btn telegram-btn" onclick="openTelegram()">TELEGRAM</button>
            <div id="status" style="font-size: 10px; color: #ff3355; text-align: center; margin-top: 4px;"></div>
        </div>

        <!-- Dashboard -->
        <div id="mainDashboard">
            <div id="periodDisplay" style="font-size: 10px; color: #aaa;">PERIOD: --</div>
            <div class="prediction" id="predictionBox">--</div>
            <div class="lucky-num" id="luckyNumberBox">LUCKY: --</div>
            <div class="timer" id="timerDisplay">00:30</div>
            
            <div class="stats-box">
                <span>WIN: <span id="winCount" class="win-text">0</span></span>
                <span>LOSS: <span id="lossCount" class="loss-text">0</span></span>
            </div>

            <div id="notificationBox" class="notification-box" style="color: #ffcc00;">Status: Waiting...</div>

            <div class="footer-btns">
                <button class="exit-btn" onclick="location.reload()">EXIT</button>
                <button class="hide-btn" onclick="hideWidget()">HIDE</button>
            </div>
        </div>
    </div>

    <button id="show-btn" onclick="showWidget()">SHOW</button>

    <script>
        const CORRECT_PASS = "Rakib@391";
        let lastPeriod = "";
        let wins = 0;
        let losses = 0;
        let currentPrediction = "BIG";

        function checkLogin() {
            const pass = document.getElementById('passInput').value.trim();
            const status = document.getElementById('status');
            if (pass === CORRECT_PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
                startEngine();
            } else {
                status.innerText = "Wrong Password!";
            }
        }

        function openTelegram() {
            window.open('https://t.me/+8801947320321', '_blank');
        }

        function startEngine() {
            setInterval(() => {
                const now = new Date();
                const sec = now.getSeconds();
                const remain = 30 - (sec % 30);
                
                document.getElementById('timerDisplay').innerText = "00:" + (remain < 10 ? "0" : "") + remain;
                
                const totalSeconds = Math.floor(now.getTime() / 1000);
                const periodIndex = Math.floor(totalSeconds / 30);
                const currentPeriod = String(now.getFullYear()) + 
                                      String(now.getMonth()+1).padStart(2,'0') + 
                                      String(now.getDate()).padStart(2,'0') + 
                                      "10" + String(periodIndex).slice(-5);
                
                document.getElementById('periodDisplay').innerText = "PERIOD: " + currentPeriod;

                if (currentPeriod !== lastPeriod) {
                    if (lastPeriod !== "") {
                        let actualResult = Math.random() > 0.4 ? currentPrediction : (currentPrediction === "BIG" ? "SMALL" : "BIG");
                        let notifBox = document.getElementById('notificationBox');
                        
                        if (actualResult === currentPrediction) {
                            wins++;
                            document.getElementById('winCount').innerText = wins;
                            notifBox.innerHTML = "🎉 WIN! Result matched";
                            notifBox.style.color = "#00ffcc";
                        } else {
                            losses++;
                            document.getElementById('lossCount').innerText = losses;
                            notifBox.innerHTML = "❌ LOSS! Result did not match";
                            notifBox.style.color = "#ff3355";
                        }
                    }

                    lastPeriod = currentPeriod;
                    const types = ['BIG 🔴', 'SMALL 🟢'];
                    const pred = types[Math.floor(Math.random() * types.length)];
                    currentPrediction = pred.includes("BIG") ? "BIG" : "SMALL";
                    
                    document.getElementById('predictionBox').innerText = pred;

                    let lucky;
                    if (currentPrediction === "BIG") {
                        lucky = Math.floor(Math.random() * 5) + 5;
                    } else {
                        lucky = Math.floor(Math.random() * 5);
                    }
                    document.getElementById('luckyNumberBox').innerText = "LUCKY: " + lucky;
                }
            }, 1000);
        }

        function hideWidget() {
            document.getElementById('app-widget').style.display = 'none';
            document.getElementById('show-btn').style.display = 'block';
        }

        function showWidget() {
            document.getElementById('app-widget').style.display = 'flex';
            document.getElementById('show-btn').style.display = 'none';
        }

        // Draggable logic for touch & mouse
        function makeDraggable(elmnt, handle) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            let dragItem = handle || elmnt;

            dragItem.onmousedown = dragMouseDown;
            dragItem.addEventListener('touchstart', dragTouchStart, { passive: false });

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.transform = "none";
            }

            function dragTouchStart(e) {
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                document.addEventListener('touchend', closeDragElement, { passive: false });
                document.addEventListener('touchmove', elementTouchDrag, { passive: false });
            }

            function elementTouchDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.touches[0].clientX;
                pos2 = pos4 - e.touches[0].clientY;
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.transform = "none";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.removeEventListener('touchend', closeDragElement);
                document.removeEventListener('touchmove', elementTouchDrag);
            }
        }

        makeDraggable(document.getElementById("app-widget"), document.getElementById("panelHeader"));
        makeDraggable(document.getElementById("show-btn"));
    </script>
</body>
</html>
