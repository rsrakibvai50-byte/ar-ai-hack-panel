<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR AI HACK PANEL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #0b0f19;
            font-family: sans-serif;
        }
        #gameFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        @keyframes borderRotate {
            0% { border-color: #ff3355; box-shadow: 0 0 15px rgba(255,51,85,0.6); }
            25% { border-color: #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.6); }
            50% { border-color: #ffcc00; box-shadow: 0 0 15px rgba(255,204,0,0.6); }
            75% { border-color: #9900ff; box-shadow: 0 0 15px rgba(153,0,255,0.6); }
            100% { border-color: #ff3355; box-shadow: 0 0 15px rgba(255,51,85,0.6); }
        }

        #app-widget {
            position: fixed;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            background: linear-gradient(145deg, rgba(12,12,20,0.96), rgba(24,24,42,0.96));
            border-radius: 16px;
            border: 3px solid #00ffcc;
            animation: borderRotate 4s infinite linear;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            padding: 10px;
            color: #fff;
            touch-action: none;
        }
        .title {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 6px;
            cursor: move;
            padding: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
        }
        .input-box {
            width: 100%;
            padding: 7px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #00ffcc;
            border-radius: 6px;
            color: #fff;
            font-size: 11px;
            text-align: center;
            outline: none;
            margin-bottom: 6px;
            user-select: text;
        }
        .btn {
            width: 100%;
            padding: 7px;
            background: #00ffcc;
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
            margin-bottom: 5px;
        }
        .telegram-btn { background: #0088cc; color: #fff; }
        
        #mainDashboard {
            display: none;
            text-align: center;
        }
        .period-display {
            font-size: 10px;
            color: #ffcc00;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .prediction-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 3px 0;
        }
        .prediction {
            font-size: 18px;
            font-weight: 900;
            color: #00ffcc;
        }
        
        .game-ball {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            margin: 0 auto;
        }
        .ball-green { background: linear-gradient(135deg, #28a745, #218838); border: 2px solid #5dd879; }
        .ball-red { background: linear-gradient(135deg, #dc3545, #c82333); border: 2px solid #ff6b77; }
        .ball-violet { background: linear-gradient(135deg, #6f42c1, #5a32a3); border: 2px solid #9c71ec; }
        .ball-mixed { background: linear-gradient(135deg, #dc3545 50%, #6f42c1 50%); border: 2px solid #ffcc00; }

        .lucky-label {
            font-size: 10px;
            color: #ffcc00;
            margin-top: 2px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .footer-btns {
            display: flex;
            gap: 5px;
            margin-top: 6px;
        }
        .footer-btns button {
            flex: 1;
            padding: 5px;
            font-size: 9px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .exit-btn { background: #ff3355; color: #fff; }
        .hide-btn { background: #00ffcc; color: #000; }
        .history-btn { background: #ffcc00; color: #000; }

        #historyModal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            max-height: 350px;
            overflow-y: auto;
            background: rgba(15, 15, 25, 0.98);
            border: 2px solid #ffcc00;
            border-radius: 12px;
            padding: 10px;
            z-index: 10001;
            display: none;
            color: #fff;
            box-shadow: 0 0 20px rgba(255,204,0,0.4);
        }
        #historyModal h3 { font-size: 12px; color: #ffcc00; margin-bottom: 8px; text-align: center; }
        .history-item {
            font-size: 10px;
            background: rgba(255,255,255,0.05);
            margin: 4px 0;
            padding: 6px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item span { font-weight: bold; }
        .win-tag { color: #00ffcc; }
        .loss-tag { color: #ff3355; }
        
        #historyModal button { margin-top: 8px; width: 100%; padding: 5px; font-size: 10px; background: #ff3355; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        #show-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-weight: bold;
            font-size: 10px;
            cursor: pointer;
            z-index: 10000;
            display: none;
            box-shadow: 0 0 15px rgba(0,255,204,0.5);
        }
    </style>
</head>
<body>

    <iframe id="gameFrame" src="https://dkwin15.com/#/login"></iframe>

    <div id="app-widget">
        <div class="title" id="panelHeader">AR AI HACK PANEL</div>

        <div id="login-screen">
            <input type="password" id="passInput" class="input-box" placeholder="ENTER PASSWORD">
            <input type="text" id="startPeriodInput" class="input-box" placeholder="PASTE CURRENT PERIOD (e.g. 20260929...)">
            <button class="btn" onclick="checkLogin()">LOGIN NOW</button>
            <button class="btn telegram-btn" onclick="openTelegram()">TELEGRAM</button>
            <div id="status" style="font-size: 9px; color: #ff3355; text-align: center; margin-top: 3px;"></div>
        </div>

        <div id="mainDashboard">
            <div class="period-display" id="periodDisplayBox">PERIOD: --</div>
            <div class="period-display" id="timerDisplayBox" style="color: #00ffcc;">TIMER: --s</div>
            
            <div class="prediction-row">
                <div class="prediction" id="predictionBox">--</div>
            </div>

            <div style="margin: 4px 0;">
                <div class="lucky-label">LUCKY NUMBER</div>
                <div id="luckyBallContainer" class="game-ball ball-green">?</div>
            </div>

            <div class="footer-btns">
                <button class="history-btn" onclick="openHistoryModal()">HISTORY</button>
                <button class="hide-btn" onclick="hideWidget()">HIDE</button>
                <button class="exit-btn" onclick="location.reload()">EXIT</button>
            </div>
        </div>
    </div>

    <div id="historyModal">
        <h3>SIGNAL HISTORY</h3>
        <div id="historyListContainer"></div>
        <button onclick="closeHistoryModal()">CLOSE</button>
    </div>

    <button id="show-btn" onclick="showWidget()">SHOW</button>

    <script>
        const CORRECT_PASS = "Rakib@391";
        let syncInterval = null;
        let currentActivePeriod = null;
        let lastSecond = -1;
        let historyLogs = [];

        function checkLogin() {
            const pass = document.getElementById('passInput').value.trim();
            const periodInput = document.getElementById('startPeriodInput').value.trim();
            const status = document.getElementById('status');
            
            if (pass !== CORRECT_PASS) {
                status.innerText = "Wrong Password!";
                return;
            }
            if (!periodInput || isNaN(periodInput)) {
                status.innerText = "Enter valid starting period!";
                return;
            }

            currentActivePeriod = BigInt(periodInput);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'block';
            startLiveSync();
        }

        function openTelegram() {
            window.open('https://t.me/+8801947320321', '_blank');
        }

        function startLiveSync() {
            updatePanelData();

            if (syncInterval) clearInterval(syncInterval);
            
            syncInterval = setInterval(() => {
                let now = new Date();
                let sec = now.getSeconds();
                let remainingSeconds = 30 - (sec % 30);
                
                document.getElementById('timerDisplayBox').innerText = "TIMER: " + remainingSeconds + "s";

                let currentCycle = Math.floor(sec / 30);
                if (lastSecond !== currentCycle) {
                    lastSecond = currentCycle;
                    if (currentActivePeriod !== null) {
                        currentActivePeriod += 1n; // Auto increase period by 1
                        updatePanelData();
                    }
                }
            }, 500);
        }

        function updatePanelData() {
            if (currentActivePeriod === null) return;
            let periodStr = currentActivePeriod.toString();
            
            document.getElementById('periodDisplayBox').innerText = "PERIOD: " + periodStr;

            let lastDigitCode = parseInt(periodStr.slice(-1));
            let luckyNum = lastDigitCode % 10;
            let isBig = luckyNum >= 5;
            let predText = isBig ? "BIG" : "SMALL";
            
            document.getElementById('predictionBox').innerText = predText + (isBig ? " 🔴" : " 🟢");

            let ballContainer = document.getElementById('luckyBallContainer');
            ballContainer.innerText = luckyNum;
            ballContainer.className = "game-ball";

            if (luckyNum === 0 || luckyNum === 5) {
                ballContainer.classList.add("ball-mixed");
            } else if ([1, 3, 7, 9].includes(luckyNum)) {
                ballContainer.classList.add("ball-green");
            } else {
                ballContainer.classList.add("ball-red");
            }

            // History te log save kora (Simulated Win/Loss based on number pattern)
            let isWin = (luckyNum % 2 === 0 && !isBig) || (luckyNum % 2 !== 0 && isBig) || (luckyNum === 0 || luckyNum === 5);
            let resultStatus = isWin ? "WIN" : "LOSS";

            historyLogs.unshift({
                period: periodStr,
                prediction: predText,
                number: luckyNum,
                status: resultStatus
            });

            if (historyLogs.length > 20) historyLogs.pop(); // Keep last 20 records
        }

        function openHistoryModal() {
            let container = document.getElementById('historyListContainer');
            container.innerHTML = "";

            if (historyLogs.length === 0) {
                container.innerHTML = "<p style='text-align:center; font-size:10px; margin:10px;'>No history available yet.</p>";
            } else {
                historyLogs.forEach(item => {
                    let div = document.createElement('div');
                    div.className = 'history-item';
                    let statusClass = item.status === "WIN" ? "win-tag" : "loss-tag";
                    div.innerHTML = `
                        <div>
                            <span style="color:#ffcc00;">${item.period}</span><br>
                            <span>${item.prediction} (${item.number})</span>
                        </div>
                        <span class="${statusClass}">${item.status}</span>
                    `;
                    container.appendChild(div);
                });
            }

            document.getElementById('historyModal').style.display = 'block';
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').style.display = 'none';
        }

        function hideWidget() {
            document.getElementById('app-widget').style.display = 'none';
            document.getElementById('show-btn').style.display = 'block';
        }

        function showWidget() {
            document.getElementById('app-widget').style.display = 'flex';
            document.getElementById('show-btn').style.display = 'none';
        }

        function makeDraggable(elmnt, handle) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            let dragItem = handle || elmnt;

            dragItem.onmousedown = dragMouseDown;
            dragItem.addEventListener('touchstart', dragTouchStart, { passive: false });

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.transform = "none";
            }

            function dragTouchStart(e) {
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                document.addEventListener('touchend', closeDragElement, { passive: false });
                document.addEventListener('touchmove', elementTouchDrag, { passive: false });
            }

            function elementTouchDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.touches[0].clientX;
                pos2 = pos4 - e.touches[0].clientY;
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.transform = "none";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.removeEventListener('touchend', closeDragElement);
                document.removeEventListener('touchmove', elementTouchDrag);
            }
        }

        makeDraggable(document.getElementById("app-widget"), document.getElementById("panelHeader"));
        makeDraggable(document.getElementById("show-btn"));
    </script>
</body>
</html>
